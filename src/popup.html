<!doctype html><html><head><meta charset="utf-8"><title>FocusPilot</title><link rel="stylesheet" href="style.css"><style>body{width:360px}.app{padding:15px}.card{box-shadow:none}.hero h1{font-size:25px}.grid{display:grid;grid-template-columns:1fr;gap:10px}</style></head><body><div class="app"><div class="topbar"><div class="brand"><div class="logo">✦</div>FocusPilot</div></div><div class="grid"><section class="card"><h2>Фокус</h2><div class="statgrid"><div class="stat"><b id="focus">0</b><span class="muted">мин</span></div><div class="stat"><b id="done">0</b><span class="muted">задач</span></div><div class="stat"><b id="blocks">0</b><span class="muted">блоков</span></div></div></section><section class="card"><button class="btn primary" id="newtab" style="width:100%">Открыть FocusPilot</button><button class="btn" id="capture" style="width:100%;margin-top:8px">Сохранить эту страницу</button><button class="btn" id="theme" style="width:100%;margin-top:8px">Переключить тему</button></section></div></div><script src="storage.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>
